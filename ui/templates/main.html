<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geohab Plugin</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <!-- HEADER / NAVBAR -->
    <header class="navbar">
        <div class="nav-left">
            <button id="logo-btn" class="logo-link" onclick="bridge.navigate('home')">
                <img src="../../logo.png" alt="CDHU" class="logo-img">
            </button>
            <div class="dropdown">
                <button class="dropbtn">Arquivo <span class="chevron">▾</span></button>
                <div class="dropdown-content">
                    <a href="#" onclick="trySaveMetadata()">Continuar depois</a>
                    <a href="#" onclick="tryExportXml()">Exportar .xml</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn">Catálogo Geohab <span class="chevron">▾</span></button>
                <div class="dropdown-content">
                    <a href="#" onclick="navigate('editor')">Editar Metadados</a>
                    <a href="#" onclick="tryExportGeohab()">Publicar no Catálogo</a>
                </div>
            </div>
            <div class="dropdown">
                <button class="dropbtn">GeoServer <span class="chevron">▾</span></button>
                <div class="dropdown-content">
                    <a href="#" onclick="bridge.navigate('geoserver')">Publicar Camada</a>
                </div>
            </div>
        </div>

        <div class="nav-right">
            <div id="layer-badge" class="layer-badge" style="display:none" title="Camada ativa no QGIS">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                    <polyline points="2 17 12 22 22 17"/>
                    <polyline points="2 12 12 17 22 12"/>
                </svg>
                <span id="layer-badge-name"></span>
            </div>
            <div id="user-info" class="user-badge" style="display: none;" onclick="doLogout()" title="Clique para sair">
                <span class="user-name">Usuário</span>
                <div class="status-dot"></div>
            </div>
            <button id="login-btn" class="btn btn-login" onclick="navigate('login')">Entrar</button>
        </div>
    </header>

    <!-- CONTEÚDO DINÂMICO (PAINÉIS) -->
    <main id="app-container">
        <!-- O conteúdo será injetado aqui via JS -->
        <div class="loader">Carregando interface...</div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <span class="support-text">Se problemas, abrir um ticket no <a href="https://cda.cdhu.sp.gov.br"
                target="_blank">CDA</a></span>
        <span class="version-tag">v1.0.4 (Beta)</span>
    </footer>

    <!-- SCRIPTS -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
