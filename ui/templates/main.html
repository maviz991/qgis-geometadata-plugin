<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geohab Plugin</title>
    <link rel="stylesheet" href="css/styles.css?v=7">
    <link rel="stylesheet" href="css/modals.css?v=7">
    <script src="js/modals.js?v=7"></script>
</head>

<body>
    <!-- HEADER / NAVBAR -->
    <header class="navbar">
        <div class="nav-left">
            <button id="logo-btn" class="logo-link" onclick="bridge.navigate('home')">
                <img src="../../img/cdhu-logo-white.svg" alt="CDHU" class="logo-img">
            </button>

            <div class="dropdown">
                <button class="dropbtn">
                    <span>Arquivo</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="4"
                        stroke="currentColor" class="chevron-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
                    </svg>
                </button>
                <div class="dropdown-content">
                    <a href="#" onclick="trySaveMetadata()">Continuar Depois</a>
                    <a href="#" onclick="tryExportXml()">Exportar Metadado</a>
                    <a href="#" onclick="tryImportXml()">Importar Metadado</a>
                    <a href="#" onclick="tryResetForm()">Descartar Alterações</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">
                    <span>Catálogo</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="4"
                        stroke="currentColor" class="chevron-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
                    </svg>
                </button>
                <div class="dropdown-content">
                    <a href="#" onclick="navigate('editor')">Editor de Metadado</a>
                    <a href="#" onclick="tryExportGeohab()">Publicar Metadado</a>
                </div>
            </div>

            <div class="dropdown">
                <button class="dropbtn">
                    <span>Serviços</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="4"
                        stroke="currentColor" class="chevron-icon">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
                    </svg>
                </button>
                <div class="dropdown-content">
                    <a href="#" onclick="bridge.navigate('geoserver')">Configurar Camada</a>
                    <a href="#" onclick="bridge.navigate('geoserver')">Publicar Camada</a>
                </div>
            </div>
        </div>

        <div class="nav-right">
            <div class="layer-picker-wrap">
                <button id="layer-badge" class="layer-badge" style="display:none"
                    data-title="Clique para trocar a camada ativa" onclick="toggleLayerPicker(event)">
                    <svg id="layer-badge-icon" width="15" height="15" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
                        style="flex-shrink:0">
                        <polygon points="12 2 2 7 12 12 22 7 12 2" />
                        <polyline points="2 17 12 22 22 17" />
                        <polyline points="2 12 12 17 22 12" />
                    </svg>
                    <span id="layer-badge-name"
                        style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
                    <svg id="layer-chevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
                        style="flex-shrink:0;transition:transform .2s">
                        <path d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                    </svg>
                </button>
                <div id="layer-picker-dropdown" class="layer-picker-dropdown" style="display:none"></div>
            </div>
            <div id="user-info" class="user-badge" style="display: none;" onclick="doLogout()"
                data-title="Clique para sair">
                <span class="user-name">Usuário</span>
                <div class="status-dot"></div>
            </div>
            <button id="login-btn" class="btn btn-login" onclick="navigate('login')">Entrar</button>
        </div>
    </header>

    <!-- CONTEÚDO DINÂMICO (PAINÉIS) -->
    <main id="app-container">
        <!-- O conteúdo será injetado aqui via JS -->
        <div class="loader">Carregando interface...</div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <span class="support-text">Se problemas, abrir um ticket no <a id="cda-link" href="#"
                target="_blank">CDA</a></span>
        <span class="version-tag">v1.0.4-Dev</span>
    </footer>

    <!-- SCRIPTS -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
