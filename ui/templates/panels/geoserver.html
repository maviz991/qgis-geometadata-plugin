<div class="geoserver-panel">
    <div class="gs-panel-header">
        <h1>Publicação de Camadas</h1>
        <div id="gs-layer-card" class="gs-layer-status">
            <span class="gs-status-text">Detectando camada ativa...</span>
        </div>
    </div>

    <div id="gs-publish-form" class="form-grid" style="display:none">
        <div class="form-group">
            <label for="gs-workspace">Workspace</label>
            <div id="gs-workspace-wrap">
                <select id="gs-workspace" onchange="onGsWorkspaceChange(this.value)">
                    <option value="">Carregando...</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="gs-datastore">Datastore</label>
            <div id="gs-datastore-wrap">
                <select id="gs-datastore" disabled>
                    <option value="">Selecione um workspace primeiro</option>
                </select>
            </div>
            <small id="gs-datastore-check" class="gs-name-preview"></small>
            <button type="button" class="gs-autodetect-link" onclick="autoDetectGsDatastore()"
                data-title="Não sabe o workspace/datastore certo da camada? Isso varre todos e procura onde a tabela está - pode demorar alguns segundos.">Não
                sei o workspace/datastore - detectar automaticamente</button>
            <small id="gs-autodetect-status" class="gs-name-preview"></small>
            <div id="gs-autodetect-candidates" class="gs-autodetect-candidates" style="display:none"></div>
        </div>

        <div class="form-group">
            <label for="gs-layer-name">Nome da camada publicada <button class="help-btn"
                    data-tip="Nome que a camada vai ter no GeoServer. É ajustado automaticamente para minúsculas, sem espaços/acentos e sem começar com número (exigência do GeoServer).">?</button></label>
            <input id="gs-layer-name" type="text" placeholder="nome_da_camada"
                oninput="onGsLayerNameInput(this.value)">
            <small id="gs-layer-name-preview" class="gs-name-preview"></small>
        </div>

        <div class="form-group">
            <label for="gs-layer-title">Título <button class="help-btn"
                    data-tip="Nome de exibição da camada no GeoServer (livre, sem as regras de sanitização do campo Nome). Pré-preenchido com o título do metadado, se houver.">?</button></label>
            <input id="gs-layer-title" type="text" placeholder="Título de exibição">
        </div>

        <div class="form-group span-2">
            <button id="gs-publish-btn" class="btn btn-primary" onclick="confirmGsPublish()" disabled>
                Publicar no GeoServer
            </button>
        </div>
    </div>
</div>
