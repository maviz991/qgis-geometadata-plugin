<div class="geoserver-panel">

    <!-- ABAS -->
    <div class="form-tabs">
        <button class="tab-link active" onclick="showTab('gs-destino', this)">Destino</button>
        <button class="tab-link" onclick="showTab('gs-identificacao', this)">Identificação</button>
        <button class="tab-link" onclick="showTab('gs-estilos', this)">Estilos</button>

        <div class="tabs-status-group">
            <button type="button" id="gs-refresh-btn" class="badge-refresh-btn" style="display:none"
                onclick="event.stopPropagation();refreshGsSync();"
                data-title="Verificar novamente (ignora o resultado em cache)">↻</button>
            <div id="gs-sync-badge" class="gn-sync-badge" style="display:none" onclick="onGsSyncBadgeClick()">
                <span class="gn-sync-dot"></span>
                <span class="gn-sync-label" id="gs-sync-label"></span>
            </div>
            <div class="progress-wrapper"
                data-title="Progresso de preenchimento dos campos obrigatórios (Workspace/Datastore/Nome)">
                <div class="circular-progress" id="gs-progress-spinner" style="--progress: 0;">
                    <span class="progress-value" id="gs-progress-text">0%</span>
                </div>
            </div>
        </div>
    </div>

    <div id="gs-update-banner" class="gn-update-banner" style="display:none">
        <span>O formulário atual é diferente do que está publicado no Geohab - clique para trazer os dados do
            servidor.</span>
        <button class="btn-icon accent" onclick="applyGsLayerUpdate()">Atualizar agora</button>
        <button class="gn-update-banner-close" onclick="dismissGsUpdateBanner()">&times;</button>
    </div>

    <!-- ══ ABA 1: DESTINO ══════════════════════════════ -->
    <div id="tab-gs-destino" class="tab-content active">
        <!-- .tab-header-actions (geonetwork.css) - mesmo padrão do "Capturar da camada"
             no editor GN: fica fixo no canto superior direito da aba inteira, sem
             sobrepor nada. -->
        <div class="tab-header-actions">
            <button type="button" class="btn-icon accent gs-autodetect-btn" onclick="autoDetectGsDatastore()"
                data-title="Não sabe o workspace/datastore certo da camada? Isso varre todos e procura onde a tabela está - pode demorar alguns segundos.">Detectar
                automaticamente</button>
        </div>

        <div class="form-grid">
            <div class="form-group span-2">
                <div id="gs-layer-card" class="gs-layer-status">
                    <span class="gs-status-text">Detectando camada ativa...</span>
                </div>
            </div>

            <div class="gs-destino-row span-2">
                <div class="form-group">
                    <label for="gs-workspace">Workspace <span class="req">*</span> <button class="help-btn"
                            data-tip="Workspace do Geohab onde a camada será publicada - define o namespace/prefixo usado nas URLs WMS/WFS da camada.">?</button></label>
                    <div id="gs-workspace-wrap">
                        <select id="gs-workspace" onchange="onGsWorkspaceChange(this.value)">
                            <option value="">Carregando...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="gs-datastore">Datastore <span class="req">*</span> <button class="help-btn"
                            data-tip="Datastore (conexão com o banco) dentro do workspace escolhido, onde a tabela da camada será publicada.">?</button></label>
                    <div id="gs-datastore-wrap">
                        <select id="gs-datastore" disabled>
                            <option value="">Selecione um workspace primeiro</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group span-2">
                <small id="gs-datastore-check" class="gs-status-box"></small>
                <div id="gs-autodetect-box" class="gs-status-box" style="display:none">
                    <span id="gs-autodetect-spinner" class="gs-mini-spinner" style="display:none"></span>
                    <small id="gs-autodetect-status"></small>
                    <div id="gs-autodetect-candidates" class="gs-autodetect-candidates" style="display:none"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ══ ABA 2: IDENTIFICAÇÃO ══════════════════════════════ -->
    <div id="tab-gs-identificacao" class="tab-content">
        <!-- .tab-header-actions (geonetwork.css) - mesmo padrão do "Capturar da camada"
             no editor GN: fica fixo no canto superior direito da aba inteira (não de um
             campo específico, já que preenche Título+Resumo+Palavras-chave juntos). -->
        <div class="tab-header-actions">
            <button type="button" id="gs-pull-gn-btn" class="btn-icon accent"
                onclick="pullGsAbstractKeywordsFromGn()" disabled
                data-title="Preenche Título, Resumo e Palavras-chave a partir do metadado já existente pra esta camada (rascunho local, salvo no banco, ou publicado no GeoNetwork), se houver.">Puxar do Metadado</button>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="gs-layer-name">Nome da camada publicada <span class="req">*</span> <button class="help-btn"
                        data-tip="Nome que a camada vai ter no Geohab. Precisa ser IDÊNTICO ao nome da tabela no banco de dados - é assim que o GeoServer localiza os dados. Ajustado automaticamente para minúsculas, sem espaços/acentos e sem começar com número (exigência do GeoServer).">?</button>
                    <button type="button" id="gs-layer-name-lock" class="gs-lock-btn"
                        onclick="_gsToggleFieldLock('gs-layer-name')" style="display:none"></button>
                </label>
                <input id="gs-layer-name" type="text" placeholder="nome_da_camada"
                    oninput="onGsLayerNameInput(this.value)">
                <small id="gs-layer-name-preview" class="gs-name-preview"></small>
                <div id="gs-layer-name-mismatch" class="gs-status-box gs-warning-text" style="display:none">
                    Diferente do nome da tabela no banco.
                    <button type="button" class="btn-icon accent" onclick="_gsUseTableNameForLayerName()"
                        data-title="O GeoServer localiza os dados pelo nome exato da tabela no banco - preenche o campo com esse valor automaticamente.">Usar
                        nome da tabela</button>
                </div>
            </div>

            <div class="form-group">
                <label for="gs-layer-title">Título <button class="help-btn"
                        data-tip="Nome de exibição da camada no Geohab (livre, sem as regras de sanitização do campo Nome). Pré-preenchido com o título do metadado, se houver.">?</button>
                    <button type="button" id="gs-layer-title-lock" class="gs-lock-btn"
                        onclick="_gsToggleFieldLock('gs-layer-title')" style="display:none"></button>
                </label>
                <input id="gs-layer-title" type="text" placeholder="Título de exibição">
            </div>

            <div class="form-group span-2">
                <label for="gs-layer-abstract">Resumo <button class="help-btn"
                        data-tip="Descrição da camada. Pode ser puxado do metadado já publicado no GeoNetwork para esta camada, se houver.">?</button></label>
                <textarea id="gs-layer-abstract" rows="4" placeholder="Resumo da camada..."></textarea>
            </div>

            <div class="form-group span-2">
                <label>Palavras-chave <button class="help-btn"
                        data-tip="Palavras-chave da camada. Podem ser puxadas do metadado no GeoNetwork (botão em Resumo) ou digitadas aqui.">?</button></label>
                <div class="keyword-input-row">
                    <input id="gs-kw-input" type="text" data-title="Pressione Enter após digitar cada palavra-chave."
                        placeholder="Adicionar palavra-chave..."
                        onkeydown="if(event.key==='Enter'){event.preventDefault();gsAddKeyword();}">
                    <button class="btn-icon accent" onclick="gsAddKeyword()">+</button>
                </div>
                <div class="keyword-chips" id="gs-keyword-chips"></div>
            </div>

            <div class="form-group span-2">
                <label>Link de metadados no GeoServer <button class="help-btn"
                        data-tip="Só consulta - não editável aqui. É a URL que vai ser gravada como &quot;Link de metadados&quot; na camada ao publicar, apontando pro registro MGB desta camada no GeoNetwork. Só existe quando a camada já tem metadado salvo (banco ou GeoNetwork) - sem isso, nada é criado.">?</button></label>
                <div id="gs-metadata-link-preview" class="gs-status-box">Nenhum metadado salvo pra essa camada ainda - o link de metadados não será criado ao publicar.</div>
            </div>
        </div>
    </div>

    <!-- ══ ABA 3: ESTILOS ══════════════════════════════ -->
    <div id="tab-gs-estilos" class="tab-content">
        <div class="form-grid">
            <div class="form-group span-2">
                <label for="gs-style-source">Estilo principal <span class="req">*</span> <button class="help-btn"
                        data-tip="O estilo escolhido aqui vira o estilo padrão (default) da camada no Geohab, aplicado junto com a publicação - ou depois, via 'Serviços > Atualizar Estilo'.">?</button></label>
                <div id="gs-style-source-wrap">
                    <select id="gs-style-source" onchange="onGsStyleSourceChange(this.value)">
                        <option value="qgis" selected>Usar estilo atual do QGIS</option>
                        <option value="file">Carregar arquivo SLD</option>
                        <option value="existing">Usar estilo existente no Geohab</option>
                        <option value="none">Usar estilo padrão do Geohab</option>
                    </select>
                </div>
            </div>

            <!-- Fonte 'qgis'/'file': o estilo será CRIADO/ATUALIZADO no workspace de
                 publicação com esse nome (mesma sanitização RF04 do nome da camada).
                 span-2: sem isso, cada grupo ocupa só 1 coluna da grade (sobra metade da
                 tela vazia) e o <hr class="span-2"> logo abaixo fica espremido/deslocado
                 em vez de vir numa linha própria de largura cheia.
                 O botão "Escolher arquivo..." (fonte 'file') mora AQUI, ao lado do nome,
                 mesmo layout campo+botão numa linha só de .gs-addstyle-row usado em
                 Estilos Adicionais (mesmo o nome do estilo sendo um só campo, usado tanto
                 pra 'qgis' quanto pra 'file' - por isso o botão fica escondido/mostrado
                 por onGsStyleSourceChange, não um grupo à parte). -->
            <div class="form-group span-2" id="gs-style-name-group">
                <label for="gs-style-name">Nome do estilo no Geohab <button class="help-btn"
                        data-tip="Nome com que o estilo será criado (ou atualizado, se já existir) no workspace de publicação. Vazio = usa o mesmo nome da camada publicada. Mesmas regras do campo Nome: minúsculas, sem espaços/acentos.">?</button></label>
                <div class="gs-addstyle-row" style="margin-bottom: 0;">
                    <button type="button" class="btn-icon" id="gs-style-file-btn" onclick="pickGsSldFile()"
                        style="display:none;">Escolher arquivo...</button>
                    <input id="gs-style-name" type="text"
                        placeholder="Nome do estilo ou deixe em branco para usar nome da camada"
                        oninput="onGsStyleNameInput(this.value)">
                </div>
                <small id="gs-style-name-preview" class="gs-name-preview"></small>
            </div>

            <!-- Fonte 'existing': estilos globais + do workspace, carregados sob demanda
                 (gsBridge.list_styles - exige login). -->
            <div class="form-group span-2" id="gs-style-existing-group" style="display:none">
                <label for="gs-style-existing">Estilo existente <button class="help-btn"
                        data-tip="Estilos já cadastrados no Geohab: globais e os do workspace de publicação selecionado na aba Destino. A lista exige login no Geohab.">?</button></label>
                <div id="gs-style-existing-wrap">
                    <select id="gs-style-existing">
                        <option value="">Selecione a fonte "estilo existente" para carregar...</option>
                    </select>
                </div>
                <small id="gs-style-existing-status" class="gs-name-preview"></small>
            </div>

            <hr class="span-2" style="margin: 15px 0; border: 0; border-top: 1px solid var(--border);">

            <!-- ESTILOS ADICIONAIS - mesmo padrão em 2 blocos do Estilo Principal acima
                 (fonte numa linha própria com label; campos da fonte escolhida embaixo,
                 com a própria label). Única diferença de propósito: aqui sempre tem o
                 botão + no final da linha de campos, porque pode ter mais de um estilo
                 adicional (lista embaixo), enquanto o principal é um só. -->
            <div class="form-group span-2">
                <label>Estilos adicionais <button class="help-btn"
                        data-tip="Estilos alternativos que ficarão disponíveis na camada além do padrão. Escolha a fonte, preencha os dados e clique no + para adicionar à lista.">?</button></label>
                <div id="gs-add-style-source-wrap">
                    <select id="gs-add-style-source" onchange="onGsAddStyleSourceChange(this.value)">
                        <option value="file" selected>Carregar arquivo SLD</option>
                        <option value="existing">Usar estilo existente no Geohab</option>
                    </select>
                </div>
            </div>

            <!-- Fonte 'file': mesma linha campo+botão de Estilo Principal
                 (.gs-addstyle-row), só que aqui sempre visível (não alterna com um botão
                 escondido/mostrado) e com o + de adicionar no final. -->
            <div class="form-group span-2" id="gs-add-style-file-group">
                <label for="gs-add-style-name">Nome do estilo no Geohab <button class="help-btn"
                        data-tip="Nome com que o estilo adicional será criado (ou atualizado, se já existir) no workspace de publicação.">?</button></label>
                <div class="gs-addstyle-row gs-addstyle-row--plus" style="margin-bottom: 0;">
                    <button type="button" class="btn-icon" onclick="pickGsAddSldFile()"
                        id="gs-add-style-file-btn">Escolher arquivo...</button>
                    <input id="gs-add-style-name" type="text" placeholder="Nome do estilo, ex: camada_x_sld"
                        oninput="onGsAddStyleNameInput(this.value)">
                    <button class="btn-icon accent" onclick="gsAddAdditionalStyle()">+</button>
                </div>
            </div>

            <!-- Fonte 'existing': mesmo layout de Estilo existente do Estilo Principal
                 (#gs-style-existing-group/-wrap), com o + de adicionar ao lado. O select
                 fica num -wrap aninhado (não direto no -group) porque _renderGsStyleOptions
                 substitui o innerHTML desse wrap ao carregar a lista - se fosse direto no
                 -group, a substituição apagaria a label e o botão + junto.
                 .gs-existing-plus-row (não .gs-addstyle-row) - essa linha não tem o par
                 botão/input de 32px que exige compactar a altura do select; o select fica
                 na altura NATURAL (igual ao "Estilo existente" do Estilo Principal, sem +)
                 e o botão + estica (align-items:stretch) pra acompanhar. -->
            <div class="form-group span-2" id="gs-add-style-existing-group" style="display:none">
                <label for="gs-add-style-existing">Estilo existente <button class="help-btn"
                        data-tip="Estilo já cadastrado no Geohab (global ou do workspace de publicação) a adicionar como estilo alternativo.">?</button></label>
                <div class="gs-existing-plus-row">
                    <div id="gs-add-style-existing-wrap">
                        <select id="gs-add-style-existing">
                            <option value="">Selecione o estilo existente...</option>
                        </select>
                    </div>
                    <button class="btn-icon accent" onclick="gsAddAdditionalStyle()">+</button>
                </div>
            </div>

            <div class="form-group span-2">
                <div class="keyword-chips" id="gs-additional-styles-chips" style="margin-top: 4px; min-height: 32px;">
                </div>
            </div>
        </div>
    </div>

    <!-- Sem botão de publicar aqui de propósito - esse painel é o "editor de camada"
         (configurar destino), igual o Editor de Metadados não tem botão de publicar
         dentro dele. Publicar é "Serviços > Publicar Camada" (tryPublishGeoServerLayer,
         em geoserver.js) e salvar sem publicar é "Arquivo > Continuar Depois"
         (trySaveMetadata em app.js, que chama saveGsDraftNow aqui). -->
</div>
