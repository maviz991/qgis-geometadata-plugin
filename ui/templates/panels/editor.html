<div class="editor-panel">

    <!-- ABAS -->
    <div class="form-tabs">
        <button class="tab-link active" onclick="showTab('identificacao', this)">Identificação</button>
        <button class="tab-link" onclick="showTab('contato',       this)">Contato</button>
        <button class="tab-link" onclick="showTab('classificacao', this)">Classificação</button>
        <button class="tab-link" onclick="showTab('extensao',      this)">Extensão</button>
    </div>

    <!-- ══ TAB 1: IDENTIFICAÇÃO ══════════════════════════════ -->
    <div id="tab-identificacao" class="tab-content active">
        <div class="form-grid">

            <div class="form-group span-2">
                <label for="f-title">Título <span class="req">*</span></label>
                <input id="f-title" type="text" placeholder="Título do conjunto de dados...">
            </div>

            <div class="form-group span-2">
                <label>Data e hora do dado <span class="req">*</span></label>
                <div class="inline-row">
                    <select id="f-dateType">
                        <option value="creation">Criação</option>
                        <option value="publication">Publicação</option>
                        <option value="revision">Revisão</option>
                    </select>
                    <input id="f-date" type="datetime-local">
                </div>
            </div>

            <div class="form-group">
                <label for="f-edition">Edição</label>
                <input id="f-edition" type="number" value="0" min="0" oninput="toggleEditionDate(this.value)">
            </div>
            <div class="form-group">
                <label for="f-date_edition">Data da Edição</label>
                <input id="f-date_edition" type="datetime-local" disabled>
            </div>

            <div class="form-group span-2">
                <label for="f-abstract">Resumo <span class="req">*</span></label>
                <textarea id="f-abstract" rows="4" placeholder="Descreva o conjunto de dados..."></textarea>
            </div>

            <div class="form-group span-2">
                <label for="f-purpose">Finalidade</label>
                <textarea id="f-purpose" rows="3" placeholder="Descreva os objetivos e uso previsto..."></textarea>
            </div>

            <div class="form-group">
                <label for="f-credit">Crédito <span class="req">*</span></label>
                <input id="f-credit" type="text" placeholder="Técnico responsável">
            </div>

            <div class="form-group">
                <label for="f-status_codeListValue">Status <span class="req">*</span></label>
                <select id="f-status_codeListValue">
                    <option value="">— Selecione —</option>
                    <option value="historicalArchive">Arquivo Antigo</option>
                    <option value="completed">Concluído</option>
                    <option value="onGoing">Contínuo</option>
                    <option value="underDevelopment">Em Desenvolvimento</option>
                    <option value="required">Necessário</option>
                    <option value="obsolete">Obsoleto</option>
                    <option value="planned">Planejado</option>
                </select>
            </div>

            <div class="form-group span-2">
                <label for="f-MD_Keywords">Palavras-chave <span class="req">*</span></label>
                <input id="f-MD_Keywords" type="text" placeholder="habitação, CDHU, São Paulo">
            </div>

        </div>
    </div>
    <!-- ══ TAB 4: CONTATO ══════════════════════════════════════ -->
    <div id="tab-contato" class="tab-content">

        <div class="contacts-toolbar">
            <div class="search-wrap">
                <input id="contact-search" type="text" placeholder="Buscar organização no catálogo Geohab..."
                    oninput="suggestContacts(this.value)" onkeydown="if(event.key==='Escape') closeSuggestions()">
                <div id="search-suggestions" class="search-suggestions"></div>
            </div>
            <button class="btn-icon" onclick="suggestContacts(document.getElementById('contact-search').value)">🔍
                Buscar</button>
            <button class="btn-icon accent" onclick="toggleManualForm()">+ Manual</button>
        </div>

        <!-- Formulário manual -->
        <div class="manual-form-wrap" id="manual-form-wrap" style="display:none;">
            <div class="manual-form-header" onclick="toggleManualForm()">
                <span>➕ Novo contato manual</span>
                <span style="font-size:18px;font-weight:300;">×</span>
            </div>
            <div class="manual-form-body">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Sigla <span class="req">*</span></label>
                        <input id="mf-sigla" type="text" placeholder="ex: CDHU">
                    </div>
                    <div class="form-group">
                        <label>Organização <span class="req">*</span></label>
                        <input id="mf-org" type="text" placeholder="Nome completo">
                    </div>
                    <div class="form-group">
                        <label>E-mail</label>
                        <input id="mf-email" type="email" placeholder="contato@exemplo.com">
                    </div>
                    <div class="form-group">
                        <label>Regra</label>
                        <select id="mf-role">
                            <option value="">— Selecione —</option>
                            <option value="owner">Dono</option>
                            <option value="author">Autor</option>
                            <option value="processor">Organizador</option>
                            <option value="distributor">Distribuidor</option>
                            <option value="custodian">Depositário</option>
                            <option value="resourceProvider">Fornecedor de recurso</option>
                            <option value="principalInvestigator">Investigador principal</option>
                            <option value="originator">Originador</option>
                            <option value="pointOfContact">Ponto de contato</option>
                            <option value="publisher">Publicador</option>
                            <option value="user">Utilizador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Cargo / Departamento</label>
                        <input id="mf-position" type="text">
                    </div>
                    <div class="form-group">
                        <label>Telefone</label>
                        <input id="mf-phone" type="text" placeholder="(11) 0000-0000">
                    </div>
                    <div class="form-group span-2">
                        <label>Endereço</label>
                        <input id="mf-address" type="text" placeholder="Rua, número">
                    </div>
                    <div class="form-group">
                        <label>Cidade</label>
                        <input id="mf-city" type="text">
                    </div>
                    <div class="form-group">
                        <label>Estado</label>
                        <select id="mf-state">
                            <option value="">—</option>
                            <option value="SP">São Paulo</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>CEP</label>
                        <input id="mf-zip" type="text" placeholder="00000-000">
                    </div>
                    <div class="form-group">
                        <label>País</label>
                        <input id="mf-country" type="text" value="Brasil">
                    </div>
                </div>
            </div>
            <div class="manual-form-footer">
                <button class="btn-icon" onclick="toggleManualForm()">Cancelar</button>
                <button class="btn-icon accent" onclick="submitManualContact()">Adicionar contato</button>
            </div>
        </div>

        <!-- Tabela resumo -->
        <div class="contacts-table-wrap">
            <table class="contacts-table">
                <thead>
                    <tr>
                        <th style="width:32px;text-align:center">#</th>
                        <th>Nome da organização</th>
                        <th>Sigla</th>
                        <th>E-mail</th>
                        <th>Regra</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="contacts-tbody">
                    <tr>
                        <td colspan="6" class="empty-state">
                            Nenhum contato. Use a busca ou clique em <b>+ Manual</b>.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Accordions de detalhes -->
        <div class="contacts-accordions" id="contacts-accordions"></div>

    </div>
    <!-- ══ TAB 3: CLASSIFICAÇÃO ═══════════════════════════════ -->
    <div id="tab-classificacao" class="tab-content">
        <div class="form-grid">

            <div class="form-group">
                <label for="f-maintenanceFrequency">Frequência de Atualização <span class="req">*</span></label>
                <select id="f-maintenanceFrequency" onchange="toggleUpdateDate(this.value)">
                    <option value="">— Selecione —</option>
                    <option value="annual">Anual</option>
                    <option value="biannually">Bimestral</option>
                    <option value="quarterly">Trimestral</option>
                    <option value="monthly">Mensal</option>
                    <option value="fortnightly">Quinzenal</option>
                    <option value="weekly">Semanal</option>
                    <option value="daily">Diário</option>
                    <option value="continual">Contínuo</option>
                    <option value="irregular">Irregular</option>
                    <option value="unknown">Desconhecido</option>
                    <option value="notPlanned">Não planejado</option>
                    <option value="asNeeded">Quando necessário</option>
                </select>
            </div>

            <div class="form-group">
                <label for="f-dateOfNextUpdate">Data da próxima atualização</label>
                <input id="f-dateOfNextUpdate" type="date" disabled>
            </div>

            <div class="form-group">
                <label for="f-MD_SpatialRepresentationTypeCode">Tipo de Representação Espacial <span
                        class="req">*</span></label>
                <select id="f-MD_SpatialRepresentationTypeCode">
                    <option value="">— Selecione —</option>
                    <option value="vector">Vetor</option>
                    <option value="grid">Grid | Raster</option>
                    <option value="textTable">Tabela de texto</option>
                    <option value="tin">Rede triangular irregular (TIN)</option>
                    <option value="stereoscopicModel">Modelo estereofônico</option>
                    <option value="video">Vídeo</option>
                </select>
            </div>

            <div class="form-group">
                <label for="f-topicCategory">Categoria Temática <span class="req">*</span></label>
                <select id="f-topicCategory">
                    <option value="">— Selecione —</option>
                    <option value="boundaries">Limites Administrativos</option>
                    <option value="planningCadastre">Planejamento e Cadastro</option>
                    <option value="society">Sociedade e Cultura</option>
                    <option value="structure">Infraestrutura ou Edificação</option>
                    <option value="transportation">Transportes</option>
                    <option value="location">Localização</option>
                    <option value="imageryBaseMapsEarthCover">Mapas ou imagens de Satélite</option>
                    <option value="elevation">Altimetria, Batimetria ou Topografia</option>
                    <option value="health">Saúde</option>
                    <option value="inlandWaters">Águas Interiores</option>
                    <option value="economy">Economia</option>
                    <option value="biota">Biotipos</option>
                    <option value="climatologyMeteorologyAtmosphere">Climatologia ou Meteorologia</option>
                    <option value="geoscientificInformation">Informação GeoCientífica</option>
                    <option value="intelligenceMilitary">Informação Militar</option>
                    <option value="environment">Ambiente</option>
                    <option value="oceans">Oceanos</option>
                    <option value="utilitiesCommunication">Infraestruturas de Comunicação</option>
                    <option value="farming">Agricultura, pesca ou pecuária</option>
                </select>
            </div>

            <div class="form-group">
                <label for="f-hierarchyLevel">Nível Hierárquico <span class="req">*</span></label>
                <select id="f-hierarchyLevel">
                    <option value="dataset">Conjunto de dados</option>
                </select>
            </div>

            <div class="form-group">
                <label for="f-LanguageCode">Idioma <span class="req">*</span></label>
                <select id="f-LanguageCode">
                    <option value="por">🇧🇷 Português</option>
                    <option value="eng">🇺🇸 Inglês</option>
                    <option value="spa">🇪🇸 Espanhol</option>
                    <option value="fra">🇫🇷 Francês</option>
                    <option value="ger">🇩🇪 Alemão</option>
                </select>
            </div>

            <div class="form-group">
                <label for="f-characterSet">Codificação de Caracteres</label>
                <select id="f-characterSet">
                    <option value="utf8">UTF-8</option>
                </select>
            </div>

            <div class="form-group">
                <label for="f-thumbnail_url">URL da Miniatura</label>
                <input id="f-thumbnail_url" type="text" placeholder="https://...">
            </div>

        </div>
    </div>

    <!-- ══ TAB 4: EXTENSÃO ════════════════════════════════════ -->
    <div id="tab-extensao" class="tab-content">
        <div class="tab-header-actions">
            <button class="btn-icon" onclick="captureFromLayer()"
                title="Captura SRC e extensão N/S/L/O da camada ativa">Capturar da camada</button>
        </div>
        <div class="form-grid">

            <!-- Coordenadas -->
            <div class="form-group span-2">
                <label>Coordenadas Geográficas do Bounding Box <span class="req">*</span></label>
                <div class="bbox-grid">
                    <div></div>
                    <div class="form-group">
                        <label for="f-northBoundLatitude">Norte</label>
                        <input id="f-northBoundLatitude" type="number" step="0.000001" placeholder="-19.0">
                    </div>
                    <div></div>
                    <div class="form-group">
                        <label for="f-westBoundLongitude">Oeste</label>
                        <input id="f-westBoundLongitude" type="number" step="0.000001" placeholder="-53.0">
                    </div>
                    <div class="bbox-center"> </div>
                    <div class="form-group">
                        <label for="f-eastBoundLongitude">Leste</label>
                        <input id="f-eastBoundLongitude" type="number" step="0.000001" placeholder="-44.0">
                    </div>
                    <div></div>
                    <div class="form-group">
                        <label for="f-southBoundLatitude">Sul</label>
                        <input id="f-southBoundLatitude" type="number" step="0.000001" placeholder="-26.0">
                    </div>
                    <div></div>
                </div>
            </div>

            <!-- Sistema de Referência -->
            <div class="form-group">
                <label for="f-epsgCode">Código EPSG <span class="req">*</span></label>
                <select id="f-epsgCode" onchange="setEpsgFromCode(this.value)">
                    <option value="">— Selecione —</option>
                    <option value="EPSG:4326">EPSG:4326 — WGS 84</option>
                    <option value="EPSG:4674">EPSG:4674 — SIRGAS 2000</option>
                    <option value="EPSG:31982">EPSG:31982 — SIRGAS 2000 / UTM 22S</option>
                    <option value="EPSG:31983">EPSG:31983 — SIRGAS 2000 / UTM 23S</option>
                    <option value="EPSG:4618">EPSG:4618 — SAD69</option>
                    <option value="EPSG:31978">EPSG:31978 — SIRGAS 2000 / UTM 18S</option>
                    <option value="EPSG:31979">EPSG:31979 — SIRGAS 2000 / UTM 19S</option>
                    <option value="EPSG:31980">EPSG:31980 — SIRGAS 2000 / UTM 20S</option>
                    <option value="EPSG:31981">EPSG:31981 — SIRGAS 2000 / UTM 21S</option>
                    <option value="EPSG:31984">EPSG:31984 — SIRGAS 2000 / UTM 24S</option>
                    <option value="EPSG:31985">EPSG:31985 — SIRGAS 2000 / UTM 25S</option>
                    <option value="EPSG:29191">EPSG:29191 — SAD69 / UTM 21S</option>
                    <option value="EPSG:29192">EPSG:29192 — SAD69 / UTM 22S</option>
                    <option value="EPSG:29193">EPSG:29193 — SAD69 / UTM 23S</option>
                    <option value="EPSG:29194">EPSG:29194 — SAD69 / UTM 24S</option>
                    <option value="EPSG:32722">EPSG:32722 — WGS 84 / UTM 22S</option>
                    <option value="EPSG:32723">EPSG:32723 — WGS 84 / UTM 23S</option>
                    <option value="EPSG:32724">EPSG:32724 — WGS 84 / UTM 24S</option>
                </select>
            </div>
            <div class="form-group">
                <label for="f-epsgTitle">Título do SRC <span class="req">*</span></label>
                <input id="f-epsgTitle" type="text" placeholder="ex: SIRGAS 2000 (EPSG:4674)">
            </div>

            <!-- Escala -->
            <div class="form-group span-2">
                <label for="f-spatialResolution_denominator">Escala (denominador)</label>
                <input id="f-spatialResolution_denominator" type="text" placeholder="ex: 25000">
            </div>

            <!-- Altitude -->
            <!-- Altitude + Temporal (accordion) -->
            <div class="form-group span-2">
                <details class="extra-accordion">
                    <summary>Mais informações</summary>
                    <div class="extra-accordion-grid">
                        <div class="form-group">
                            <label for="f-zMin">Altitude mínima — Z</label>
                            <input id="f-zMin" type="number" step="any" placeholder="ex: -10">
                        </div>
                        <div class="form-group">
                            <label for="f-zMax">Altitude máxima — Z</label>
                            <input id="f-zMax" type="number" step="any" placeholder="ex: 1200">
                        </div>
                        <div class="form-group">
                            <label for="f-temporalFrom">Extensão temporal — De</label>
                            <input id="f-temporalFrom" type="date">
                        </div>
                        <div class="form-group">
                            <label for="f-temporalTo">Extensão temporal — Para</label>
                            <input id="f-temporalTo" type="date">
                        </div>
                    </div>
                </details>
            </div>

        </div>
    </div>



</div>
