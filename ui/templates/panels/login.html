<div class="login-page">

    <div class="page-bg"></div>

    <div class="login-topbar">
        <img src="../../img/cdhu-logo-white.svg" alt="CDHU" class="login-logo">
        <button class="login-toggle-btn" id="login-toggle-btn" onclick="toggleLoginMode()">ACESSO CORPORATIVO</button>
    </div>

    <!-- Card corporativo (padrão) -->
    <div class="login-center" id="login-corp-wrap">
        <div class="login-card">
            <img src="../../logo.png" alt="CDHU" class="login-card-logo">
            <h2 class="login-card-title">Geohab</h2>
            <p class="login-card-sub">Plataforma de Gestão de Dados Geográficos</p>
            <p id="login-error-msg" class="login-error" style="display:none"></p>
            <button class="btn-login-action" onclick="setLoginState(true,'Aguardando navegador...');bridge.start_login()">
                Entrar com conta CDHU
            </button>
            <button class="btn-login-back" onclick="navigate('home')">&lt; Voltar</button>
        </div>
    </div>

    <!-- Card administração (alternativo) -->
    <div class="login-center" id="login-admin-wrap" style="display:none">
        <div class="login-card">
            <h2 class="login-card-title">Acesso Geral</h2>
            <p class="login-card-sub">Conta local</p>
            <p id="login-error-msg-adm" class="login-error" style="display:none"></p>
            <div class="login-field">
                <input id="admin-user" type="text" placeholder="Usuário" autocomplete="username"
                    onkeydown="if(event.key==='Enter')document.getElementById('admin-pass').focus()">
            </div>
            <div class="login-field">
                <input id="admin-pass" type="password" placeholder="Senha" autocomplete="current-password"
                    onkeydown="if(event.key==='Enter')doAdminLogin()">
            </div>
            <button class="btn-login-action" onclick="doAdminLogin()">Entrar</button>
            <button class="btn-login-back" onclick="navigate('home')">&lt; Voltar</button>
        </div>
    </div>

    <span class="login-footer-text">GOVERNO DO ESTADO DE SÃO PAULO</span>

</div>
