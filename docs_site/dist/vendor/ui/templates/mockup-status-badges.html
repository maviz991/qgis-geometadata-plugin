<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body style="overflow:auto;height:auto;min-height:100%;">
    <div style="padding:20px 24px;display:flex;flex-direction:column;gap:14px;font-size:13px;">
        <div style="display:flex;align-items:center;gap:12px;">
            <span class="badge badge-checking" style="width:110px;text-align:center;">Verificando…</span>
            <span style="color:var(--fg-muted)">Checagem em andamento (ao abrir a Home).</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <span class="badge badge-active" style="width:110px;text-align:center;">Ativo</span>
            <span style="color:var(--fg-muted)">Servidor respondeu normalmente (HTTP 200).</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <span class="badge badge-unstable" style="width:110px;text-align:center;">Instável</span>
            <span style="color:var(--fg-muted)">Respondeu, mas com outro código - pode haver instabilidade.</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
            <span class="badge badge-offline" style="width:110px;text-align:center;">Offline</span>
            <span style="color:var(--fg-muted)">Não foi possível conectar (rede/VPN ou servidor fora do ar).</span>
        </div>
    </div>
    <style>
        .badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            display: inline-block;
        }

        .badge-checking {
            background: #f1f5f9;
            color: var(--fg-muted);
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .badge-unstable {
            background: #fef9c3;
            color: #854d0e;
        }

        .badge-offline {
            background: #fee2e2;
            color: #b91c1c;
        }
    </style>
    <script>
        (function () {
            function report() {
                if (window.parent === window) return;
                window.parent.postMessage({ docMockupHeight: document.documentElement.scrollHeight }, "*");
            }
            window.addEventListener("load", function () { report(); setTimeout(report, 200); });
            window.addEventListener("resize", report);
        })();
    </script>
</body>

</html>
